<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>管理画面 — やきいも温度モニター</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .admin-banner {
      background: var(--accent-primary, #c25e1f);
      color: var(--bg-card, #fff);
      padding: 8px 16px;
      font-family: var(--font-body, system-ui);
      font-size: 0.85rem;
      letter-spacing: 0.05em;
      text-align: center;
    }
    .admin-placeholder {
      max-width: 720px;
      margin: 80px auto;
      padding: 40px;
      text-align: center;
      font-family: var(--font-body, system-ui);
      color: var(--ink-muted, #555);
    }
    .admin-placeholder h1 {
      font-family: var(--font-display, serif);
      font-size: 1.8rem;
      color: var(--ink, #222);
      margin-bottom: 16px;
    }
    .admin-placeholder p {
      line-height: 1.7;
    }
  </style>
</head>
<body>
  <div class="admin-banner">管理画面 (Admin)</div>
  <main class="admin-placeholder">
    <h1>やきいも セッション管理</h1>
    <p>セッション一覧・公開切替・コメント機能は Phase 4 で実装予定でございます。</p>
    <p>現在は認証 + 不可視 URL の動作確認用骨組みです。</p>
    <p style="margin-top:32px;font-size:0.8rem;opacity:0.6;">
      <a href="/" style="color:inherit">↩ live dashboard へ戻る</a>
    </p>
  </main>
</body>
</html>
